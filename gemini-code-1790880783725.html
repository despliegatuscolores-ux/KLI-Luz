<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLI // LUZ — Sovereign Signal Engine [App 02]</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #080808;
            color: #e5e5e5;
        }
        textarea {
            caret-color: #e5e5e5;
        }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#080808] text-[#e5e5e5] min-h-screen flex flex-col antialiased selection:bg-neutral-800 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [view, setView] = React.useState('home'); // home, scan
            const [dilemma, setDilemma] = React.useState('');
            const [activeElement, setActiveElement] = React.useState(null);
            const [scanResult, setScanResult] = React.useState(null);

            const analyzeElement = (el) => {
                setActiveElement(el);
                const analyses = {
                    fire: {
                        name: "Fuego // Urgencia y Voluntad",
                        ego: "Urgencia reactiva, orgullo herido o prisa por demostrar control. El ego grita para no sentirse impotente o vulnerable.",
                        soul: "Certeza fulminante, fría y limpia. Una voluntad alineada que no necesita justificación, teatro ni aplauso."
                    },
                    water: {
                        name: "Water // Emoción y Sintonía",
                        ego: "Desborde emocional, apego, miedo al abandono o nostalgia que se disfraza de intuición para retener lo insostenible.",
                        soul: "Paz profunda o repulsión sutil e inquebrantable en el cuerpo. El agua fluye sin forzar ni mendigar."
                    },
                    air: {
                        name: "Aire // Visión y Mental",
                        ego: "Rumiación obsesiva, bucle mental y coartadas intelectuales para justificar lo que deseas creer por comodidad.",
                        soul: "Revelación repentina, comprensión clara de la estructura sin esfuerzo intelectual ni parpadeo."
                    },
                    earth: {
                        name: "Tierra // Somático y Materia",
                        ego: "Rigidez defensiva, resistencia enfermiza al cambio por puro terror a perder seguridad o control conocido.",
                        soul: "Gravedad, arraigo y solidez real en los huesos. Un cimiento inquebrantable que sostiene la acción sobria."
                    }
                };
                setScanResult(analyses[el]);
            };

            return (
                <div className="max-w-xl mx-auto px-6 py-12 flex flex-col min-h-screen justify-between">
                    {/* Header */}
                    <header className="border-b border-neutral-800 pb-6 flex justify-between items-center">
                        <div>
                            <h1 className="text-xl font-bold tracking-widest text-neutral-100">KLI // LUZ</h1>
                            <p className="text-xs text-neutral-500 tracking-wider mt-1">Sovereign Signal Engine [App 02]</p>
                        </div>
                        <button 
                            onClick={() => { setView('home'); setScanResult(null); setActiveElement(null); setDilemma(''); }}
                            className="text-xs tracking-widest uppercase border border-neutral-800 px-3 py-1.5 hover:border-neutral-600 transition-colors text-neutral-400"
                        >
                            Centro
                        </button>
                    </header>

                    {/* Main Content */}
                    <main className="my-auto py-8">
                        {view === 'home' && (
                            <div className="space-y-8 animate-fadeIn">
                                <div className="space-y-3">
                                    <h2 className="text-lg font-medium text-neutral-200">El Espejo de los Cuatro Elementos.</h2>
                                    <p className="text-sm text-neutral-400 leading-relaxed">
                                        Cuando te enfrentas a una decisión o impulso, la vasija opera a través de múltiples canales. Esta herramienta actúa como un espejo frío para separar el grito estridente del ego de la señal constante del alma.
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 gap-4 pt-4">
                                    <button 
                                        onClick={() => setView('scan')}
                                        className="text-left border border-neutral-800 p-5 hover:border-neutral-500 transition-all group bg-neutral-950"
                                    >
                                        <div className="text-xs text-neutral-500 tracking-wider mb-1">MÓDULO DE CALIBRACIÓN</div>
                                        <div className="text-sm font-medium text-neutral-200 group-hover:text-white">Escáner de Impulso (Ego vs. Alma)</div>
                                        <div className="text-xs text-neutral-500 mt-2">Introduce tu fricción y contrástala a través de Fuego, Agua, Aire y Tierra.</div>
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'scan' && (
                            <div className="space-y-6">
                                <div>
                                    <span className="text-xs text-neutral-500 tracking-widest uppercase">Diagnóstico de Señal</span>
                                    <h3 className="text-base font-medium text-neutral-200 mt-1">¿Qué impulso o dilema intentas contrastar?</h3>
                                </div>

                                <textarea 
                                    rows="3"
                                    value={dilemma}
                                    onChange={(e) => setDilemma(e.target.value)}
                                    placeholder="Describe el hecho o la duda sin justificaciones..."
                                    className="w-full bg-neutral-950 border border-neutral-800 p-4 text-xs text-neutral-200 focus:outline-none focus:border-neutral-600 resize-none"
                                />

                                <div className="space-y-3 pt-2">
                                    <p className="text-xs text-neutral-400 tracking-wider uppercase">Selecciona el canal elemental a auditar:</p>
                                    <div className="grid grid-cols-2 gap-3">
                                        {[
                                            { id: 'fire', label: 'Fuego', desc: 'Urgencia / Chispa' },
                                            { id: 'water', label: 'Agua', desc: 'Emoción / Sintonía' },
                                            { id: 'air', label: 'Aire', desc: 'Mental / Bucle' },
                                            { id: 'earth', label: 'Tierra', desc: 'Somático / Inercia' }
                                        ].map(el => (
                                            <button
                                                key={el.id}
                                                onClick={() => analyzeElement(el.id)}
                                                className={`p-3 text-left border transition-all ${activeElement === el.id ? 'border-neutral-200 bg-neutral-900' : 'border-neutral-800 bg-neutral-950 hover:border-neutral-700'}`}
                                            >
                                                <div className="text-xs font-medium text-neutral-200">{el.label}</div>
                                                <div className="text-[10px] text-neutral-500 mt-0.5">{el.desc}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {scanResult && (
                                    <div className="border border-neutral-800 bg-neutral-950 p-5 space-y-4 mt-6 animate-fadeIn">
                                        <div className="text-[10px] uppercase tracking-widest text-neutral-400 font-semibold">{scanResult.name}</div>
                                        <div>
                                            <span className="text-[10px] uppercase tracking-widest text-neutral-500">El Grito del Ego</span>
                                            <p className="text-xs text-neutral-300 mt-1 leading-relaxed">{scanResult.ego}</p>
                                        </div>
                                        <div className="border-t border-neutral-900 pt-3">
                                            <span className="text-[10px] uppercase tracking-widest text-neutral-400 font-semibold text-neutral-200">El Susurro del Alma</span>
                                            <p className="text-xs text-neutral-100 mt-1 leading-relaxed font-medium">{scanResult.soul}</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-neutral-900 pt-6 text-center text-[10px] text-neutral-600 tracking-widest uppercase">
                        KLI // LUZ — Cero Adornos. Cero Dependencia. Sin API.
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
